# 개발용 PostgreSQL과 S3 호환 스토리지. 계정은 로컬 개발 전용이다.
# PostgreSQL 호스트 포트는 다른 프로젝트의 5432와 겹치지 않도록 5433을 쓴다.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: barochannel
      POSTGRES_PASSWORD: barochannel
      POSTGRES_DB: barochannel
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barochannel"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # 공식 minio/minio 이미지는 배포가 중단되어 Chainguard 빌드를 디지스트로 고정한다.
    image: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: barochannel
      MINIO_ROOT_PASSWORD: barochannel
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
