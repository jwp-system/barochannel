[project]
name = "barochannel"
version = "0.1.0"
description = "조직 권한, 필수 읽음 확인, 순차 결재를 갖춘 사내 소통 시스템"
readme = "README.md"
authors = [
    { name = "jwp-system", email = "jwp.system@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.125",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
barochannel = "app.main:main"
barochannel-admin = "app.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
