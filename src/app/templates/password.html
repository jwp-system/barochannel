{% extends "page.html" %}
{% from "partials/icons.html" import icon %}
{% block title %}비밀번호 변경 · 바로채널{% endblock %}
{% block content %}
<a class="back" href="/more">{{ icon("back") }}전체</a>
<h1>비밀번호 변경</h1>
<form class="section stack" hx-post="/account/password" hx-target="#password-message">
  <label>현재 비밀번호 <input type="password" name="current_password" required autocomplete="current-password"></label>
  <label>새 비밀번호 <input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
  <div id="password-message" role="alert"></div>
  <button class="primary">변경하기</button>
</form>
{% endblock %}
