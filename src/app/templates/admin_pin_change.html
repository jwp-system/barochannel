{% extends "base.html" %}
{% block title %}PIN 변경 · 바로채널{% endblock %}
{% block body %}
<main class="center-page">
  <div class="pin-box">
    <h1 id="pin-title">{{ "처음 받은 PIN을" if first_time else "지금 쓰는 PIN을" }}<br>입력해 주세요</h1>
    {% if first_time %}<p class="muted">처음 접속하면 PIN을 바꿔야 합니다.</p>{% endif %}
    <form id="pin-form" hx-post="/admin/pin/change" hx-target="#pin-message"
          data-steps="current_pin,new_pin,confirm_pin"
          data-titles="{{ '처음 받은 PIN을' if first_time else '지금 쓰는 PIN을' }}|새 PIN을|새 PIN을 한 번 더">
      <input type="hidden" name="next" value="{{ next_url }}">
      <input type="hidden" name="current_pin">
      <input type="hidden" name="new_pin">
      <input type="hidden" name="confirm_pin">
      <input id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus autocomplete="off" aria-label="PIN 6자리">
    </form>
    {% include "partials/pin_keypad.html" %}
  </div>
</main>
{% endblock %}
